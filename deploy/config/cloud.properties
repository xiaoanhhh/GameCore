# 先安装证书、配置GAME_SERVER_KEY及平台。默认失败关闭，不降级到明文或匿名模式。
mode=platform
host=0.0.0.0
port=7201
healthPort=7202
maxRooms=4
maxConnections=16
maxPlayersPerRoom=2
nettyWorkerThreads=1
logicThreads=1
maxPendingInputs=64
pendingPerConnection=16
snapshotRate=30
tank.tickRate=30
snake.tickRate=20
fight.tickRate=30
tls=true
certificate=/etc/gamecore/tls/fullchain.pem
privateKey=/etc/gamecore/tls/privkey.pem
replayDir=/var/lib/gamecore/replays
outboxDir=/var/lib/gamecore/outbox
platformUrl=http://127.0.0.1:8080
loggingLevel=INFO
