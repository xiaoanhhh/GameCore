# 仅启动本地开发数据库；密码通过环境提供，数据卷不可随意删除。
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: gamecore
      POSTGRES_USER: gamecore
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamecore -d gamecore"]
      interval: 5s
      timeout: 3s
      retries: 10
    shm_size: 64mb
volumes:
  platform-db:
