// 三个独立JVM：正式服务器、两个真实libGDX大厅/游戏窗口。Python只作可选验收编排，不进入分发。
def onlineAcceptanceDirectory = layout.buildDirectory.dir('reports/online-tank-test')
tasks.register('prepareOnlineTankTest') {
    dependsOn tasks.named('smokeTestClasses'), tasks.named('installDist'), project(':game-server').tasks.named('installDist')
    dependsOn sourceSets.smokeTest.runtimeClasspath
    doLast {
        def directory = onlineAcceptanceDirectory.get().asFile
        directory.mkdirs()
        def installedLibraries = layout.buildDirectory.dir('install/GameCore/lib').get().asFile.absolutePath + File.separator + '*'
        new File(directory, 'classpath.txt').setText(installedLibraries + File.pathSeparator + sourceSets.smokeTest.output.classesDirs.asPath, 'UTF-8')
    }
}
tasks.register('onlineTankTest', Exec) {
    environment 'GAMECORE_OFFLINE', 'true'
    group = 'verification'
    description = '启动独立服务器和两个真实图形客户端，从大厅进入在线Tank并验收胜负/异常/反复退出。'
    dependsOn tasks.named('prepareOnlineTankTest')
    workingDir rootProject.projectDir
    commandLine 'python', rootProject.file('tools/online-tank-process-probe.py').absolutePath,
            onlineAcceptanceDirectory.get().asFile.absolutePath,
            project(':game-server').layout.buildDirectory.dir('install/GameCore-TankServer/lib').get().asFile.absolutePath + File.separator + '*'
    timeout = java.time.Duration.ofSeconds(300)
}

// 多游戏共用界面：仅回环服务，两个独立真实窗口；不连接发布配置中的云节点。
tasks.register('onlineArenaTest', Exec) {
    group = 'verification'
    description = '验证三款在线游戏共用本地布局/HUD、双人身份、缩放、连接覆盖层与结算释放。'
    dependsOn tasks.named('prepareOnlineTankTest')
    environment 'GAMECORE_OFFLINE', 'true'
    workingDir rootProject.projectDir
    timeout = java.time.Duration.ofSeconds(300)
    doFirst {
        commandLine 'python', rootProject.file('tools/run-online-multigame.py').absolutePath,
                '--java', javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath.asFile.absolutePath,
                '--client-classpath', new File(onlineAcceptanceDirectory.get().asFile,'classpath.txt').getText('UTF-8'),
                '--server-classpath', project(':game-server').layout.buildDirectory.dir('install/GameCore-TankServer/lib').get().asFile.absolutePath + File.separator + '*',
                '--output', layout.buildDirectory.dir('reports/online-arena-test').get().asFile.absolutePath
    }
}

distributions {
    main {
        contents {
            from(rootProject.file('opensource_application/Netty')) { into 'third-party/Netty'; include 'LICENSE.txt', 'NOTICE.txt', 'license/**' }
            from(rootProject.file('opensource_application/JCTools')) { into 'third-party/JCTools'; include 'LICENSE' }
            from(rootProject.file('opensource_application/Protobuf')) { into 'third-party/Protobuf'; include 'LICENSE' }
        }
    }
}

// 自带Temurin运行环境的Windows便携发布，保持常规run/installDist入口独立。
apply from: 'portable.gradle'
