plugins {
    id 'application'
}

dependencies {
    implementation project(':client')
    implementation libs.gdx.backend.lwjgl3
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${libs.versions.gdx.get()}:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${libs.versions.gdx.get()}:natives-desktop"

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

application {
    mainClass = 'dev.gamecore.lwjgl3.Lwjgl3Launcher'
    applicationName = 'GameCore'
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

// Windows cmd 对展开后的命令行有限长；lib 内只有发行包运行依赖，交给 Java 展开通配符。
// 保留 Gradle 的 Java 查找、JVM 参数、退出码与 Unix 脚本，不把本机路径写进制品。
tasks.named('startScripts') {
    doLast {
        def lines = windowsScript.readLines('UTF-8')
        if (lines.count { it.startsWith('set CLASSPATH=') } != 1) {
            throw new GradleException('Unexpected Windows launcher template: expected one classpath assignment')
        }
        windowsScript.setText(lines.collect {
            it.startsWith('set CLASSPATH=') ? 'set "CLASSPATH=%APP_HOME%\\lib\\*"' : it
        }.join('\r\n') + '\r\n', 'UTF-8')
    }
}

tasks.named('test') {
    dependsOn tasks.named('startScripts')
    systemProperty 'gamecore.test.windowsLauncher', tasks.named('startScripts').get().windowsScript.absolutePath
}

// 同时支持开发工作目录和资源打包；初始 assets 中没有受授权约束的图片/字体。
sourceSets.main.resources {
    srcDir rootProject.file('assets')
    // native解压缓存不属于运行资源，避免后续图形验收污染分发。
    exclude '**/.lwjgl/**'
}
tasks.named('run') {
    workingDir rootProject.file('assets')
    // 只显式传递本地调试参数；客户端还会检查回环地址，公网模式不允许注入。
    ['gamecore.network.dev', 'gamecore.network.rttMs', 'gamecore.network.jitterMs', 'gamecore.network.dropPercent',
     'gamecore.network.seed', 'gamecore.network.blackoutStartMs', 'gamecore.network.blackoutMs',
     'gamecore.platform.url', 'gamecore.tls.ca', 'gamecore.offline'].each { key ->
        if (System.getProperty(key) != null) { systemProperty key, System.getProperty(key) }
    }
}

// 图形测试独立于单元测试，避免无显示设备的环境被误报成规则测试失败。
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    smokeTestImplementation.extendsFrom implementation
    smokeTestRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    smokeTestImplementation project(':protocol')
    smokeTestImplementation project(':platform-api')
    smokeTestImplementation project(':game-online')
    // 图形验收检查开发链路是否真实安装；仅测试可见，不扩大桌面生产API依赖。
    smokeTestImplementation project(':network-transport')
    // 交互记录验收需要进程内的真实游戏服务器；仅测试可见。
    smokeTestImplementation project(':game-server')
}
tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = '创建真实窗口，验证大厅页面、设置、输入、缩放和生命周期，并保存截图。'
    dependsOn tasks.named('smokeTestClasses')
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'dev.gamecore.lwjgl3.DesktopSmokeTest'
    workingDir rootProject.file('assets')
    args layout.buildDirectory.dir('reports/smoke-test').get().asFile.absolutePath
    timeout = java.time.Duration.ofSeconds(45)
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
