    group = 'verification'
    description = '真实窗口与回环服务验证交互记录面板：账户开关、拖动、点击隔离、跨页面、真实对局、缩放和退出登录。'
    dependsOn tasks.named('smokeTestClasses')
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'dev.gamecore.lwjgl3.TrafficOverlaySmokeTest'
    workingDir rootProject.file('assets')
    args layout.buildDirectory.dir('reports/traffic-overlay-smoke').get().asFile.absolutePath
    timeout = java.time.Duration.ofSeconds(240)
