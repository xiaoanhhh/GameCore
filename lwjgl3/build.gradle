tasks.withType(JavaExec).configureEach {
    if (!(name in ['run','platformLobbySmokeTest','platformAuthFeedbackSmokeTest','platformUiSmokeTest','trafficOverlaySmokeTest'])) { systemProperty 'gamecore.offline', 'true' }
    def executionTemporaryDirectory = layout.buildDirectory.dir("tmp/${name}")
    systemProperty 'java.io.tmpdir', executionTemporaryDirectory.get().asFile.absolutePath
    doFirst { executionTemporaryDirectory.get().asFile.mkdirs() }
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.register('uiScaleTest', JavaExec) {
    group = 'verification'
    description = '验证窗口放大后的字体像素密度，并保存原生分辨率截图。'
    dependsOn tasks.named('smokeTestClasses')
    classpath = sourceSets.smokeTest.runtimeClasspath
