server.address=${PLATFORM_BIND:127.0.0.1}
server.port=${PLATFORM_PORT:8080}
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.max-http-request-header-size=8KB
server.error.include-message=never
spring.datasource.url=${PLATFORM_DB_URL:jdbc:postgresql://127.0.0.1:5432/gamecore}
spring.datasource.username=${PLATFORM_DB_USER:gamecore}
spring.datasource.password=${PLATFORM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.lifecycle.timeout-per-shutdown-phase=10s
server.shutdown=graceful
platform.server-id=${GAME_SERVER_ID:local-1}
platform.server-key=${GAME_SERVER_KEY:}
platform.game-host=${GAME_PUBLIC_HOST:127.0.0.1}
platform.game-port=${GAME_PUBLIC_PORT:7201}
platform.game-tls=${GAME_PUBLIC_TLS:false}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
